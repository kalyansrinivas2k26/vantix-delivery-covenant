name: Governance control change
description: Propose a versioned policy, measurement, schema or authority-control change.
title: "[CONTROL] "
labels: ["governance-change"]
body:
  - type: dropdown
    id: type
    attributes:
      label: Change type
      options:
        - Policy
        - Measurement
        - Schema
        - Authority
        - Security
        - AI boundary
    validations:
      required: true
  - type: textarea
    id: rationale
    attributes:
      label: Evidence-based rationale
    validations:
      required: true
  - type: textarea
    id: traceability
    attributes:
      label: Requirements/tests/claims affected
    validations:
      required: true
